# Build the MyST Markdown version of the script and deploy to GitHub Pages.
#
# Triggers on pushes to the mystmd-conversion branch (and main once merged);
# manual runs via workflow_dispatch.

name: MyST GitHub Pages Deploy
on:
  push:
    branches: [mystmd-conversion, main]
    paths:
      - 'mystmd/**'
      - '.github/workflows/deploy-myst.yml'
  workflow_dispatch:

env:
  # BASE_URL tells MyST where the site is served from (asset paths)
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mystmd
    steps:
      - uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick webp
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - uses: oven-sh/setup-bun@v2
      - name: Install MyST Markdown (QuantEcon fork, qe-v9)
        # Builds from source — the QuantEcon fork is not on npm.
        # qe-v9 carries everything qe-v8 had (book-mode parts, section-scoped
        # proof numbering, the title→heading chain, shared proof:* counters)
        # plus per-row equation numbering for non-starred `align`
        # (QuantEcon/mystmd#81) and KaTeX ^0.15.2 → ^0.16.21
        # (QuantEcon/mystmd#80).
        #
        # R26: this pin is COUPLED to mystmd/.tool-version. Since
        # QuantEcon/claude-latex-to-myst#201 the converter emits non-starred
        # `align` verbatim and depends on the fork's per-row numbering, so
        # both pins move together — bumping the converter alone silently
        # forfeits the fix (see issue #17). Checkout is by tag name; the
        # qe-v9 commit is 24f6ae8009961bcfb5f38d24f35c470405e869ee.
        working-directory: /tmp
        run: |
          git clone https://github.com/QuantEcon/mystmd.git qe-mystmd
          cd qe-mystmd
          git checkout qe-v9
          bun install
          bun run build
          npm install -g /tmp/qe-mystmd/packages/mystmd
      - name: Build HTML Assets
        run: myst build --html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'mystmd/_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
