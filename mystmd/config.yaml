# Deep Learning for Solving And Estimating Dynamic Economic Models
# LaTeX → MyST config
#
# Drives the shared claude-latex-to-myst pipeline against the single
# consolidated LaTeX source in ../lecture_script/. The single .tex is
# carved into 22 per-chapter pieces via preprocess.split below.

source_dir: "../lecture_script"
output_dir: "."
tmp_dir: "./tmp"

# Numbered chapters 1–12, in source order. Stems use chXX_<topic>.
chapters:
  - { stem: ch01_intro,           title: "Introduction to Machine Learning and Deep Learning" }
  - { stem: ch02_deqns,           title: "Deep Equilibrium Nets" }
  - { stem: ch03_irbc,            title: "The International Real Business Cycle Model" }
  - { stem: ch04_nas,             title: "Neural Architecture Search and Loss Normalization" }
  - { stem: ch05_olg,             title: "Overlapping Generations Models with DEQNs" }
  - { stem: ch06_ha_youngs,       title: "Heterogeneous Agents and Young's Method" }
  - { stem: ch07_pinns,           title: "Physics-Informed Neural Networks" }
  - { stem: ch08_ctime_ha,        title: "Heterogeneous Agent Models in Continuous Time" }
  # R16: the source split Ch9/10 (commits a81cf80 + c7f1762) — Ch9 is now the
  # GP toolkit and Ch10 absorbs the deep-surrogate material that used to open
  # Ch9. Titles track the new \chapter{} headings; stems are kept stable to
  # avoid churning output filenames and the myst.yml TOC.
  - { stem: ch09_surrogates_gps,  title: "Gaussian Processes" }
  - { stem: ch10_smm,             title: "Deep Surrogate Models and Structural Estimation" }
  - { stem: ch11_climate,         title: "Climate Economics and Deep Uncertainty Quantification" }
  - { stem: ch12_synthesis,       title: "Synthesis and Outlook" }

# Front matter + appendices live outside the numbered sequence.
# Appendices A–F retain the published PDF lettering in their stems.
extra_files:
  - { stem: preface,                 title: "Preface" }
  - { stem: how_to_read,             title: "How to Read This Script" }
  - { stem: notation,                title: "Notation and Symbols" }
  - { stem: execution_map,           title: "Execution Map" }
  - { stem: appA_glossary,           title: "Glossary" }
  - { stem: appB_matrix_calc,        title: "Matrix Calculus and Automatic Differentiation" }
  - { stem: appC_ito,                title: "Itô Calculus, Brownian Motion, and Ergodicity" }
  - { stem: appD_fixed_points,       title: "Fixed Points, Contraction Mappings, and the Bellman Operator" }
  - { stem: appE_reproducibility,    title: "Reproducibility Information" }
  - { stem: appF_solutions,          title: "Solutions and Guidance for Exercises" }

# Project-specific tcolorbox wrappers from the LaTeX preamble (lines 150–169
# of the source). Mapped to the closest sphinx-proof directives so they
# render as styled callouts in MyST. `definitionbox` is overloaded in the
# source (definitions, theorems, algorithm wrappers); the algorithm case
# will surface incorrectly until upstream issue #20 (`algorithmic` support)
# lands — those blocks can then be re-mapped individually.
extra_environments:
  remarkbox:      prf:remark
  keyinsightbox:  prf:remark
  definitionbox:  prf:definition

# Bibliography sits outside the LaTeX source tree (at ../readings/).
# convert.sh resolves the path relative to source_dir, so ../readings/...
# from lecture_script/ lands on the right file.
bibliography: "../readings/bibliography.bib"

# Pre-rendered figures live under lecture_script/fig/.
figures_dir: "fig"

# Inline TikZ figures are rendered by mystmd/scripts/render_tikz.py
# (auto-discovers \begin{figure} blocks containing \begin{tikzpicture},
# compiles via pdflatex+pdf2svg to mystmd/figures/<label>.svg) and the
# resulting TIKZ_FIGURE_MAP is written to mystmd/tikz_overrides.py for
# the upstream postprocess to consume.
# R18: key renamed upstream (`tikz_overrides:` is a one-release alias for the
# Phase-5 `project_overrides:` surface, which also accepts EXTRA_REWRITES and
# POST_CONVERT); same loader, same file.
project_overrides: tikz_overrides.py

# R18 — doubled-noun de-duplication, book-side extras. Upstream's
# strip_doubled_noun_refs ships defaults for Figure/Chapter/Theorem/… and,
# since QE#131 (R19), Table/Tables for the `tab-`/`tbl-` prefixes too — so
# the book's former `Table`/`Tables`+`tab-` entries are now redundant and
# were dropped in R19 (verified: the regen is byte-identical without them).
# Only `Algorithm`/`alg-` remains book-local: the upstream default keys
# Algorithm off `algo-`, but this book's labels are `alg:nsdeqn` → `alg-`,
# so "Algorithm~\ref{alg:y}" → "Algorithm {prf:ref}`alg-y`" would still
# render "Algorithm Algorithm 6.1" (4 sites) without it. These entries
# extend (do not replace) the upstream default list — strip_doubled_noun_refs
# iterates `extras + _DOUBLED_NOUN_REFS`.
doubled_noun_refs:
  - { noun: Algorithm,  prefix: alg- }
  - { noun: Algorithms, prefix: alg- }
  # R23 — Chapter refs (upstream #188, closing #184): under this book's qe-v8
  # `numbering.book` mode (myst.yml `chapters: label: "Chapter %s"`), a {ref}
  # to a chapter heading auto-renders "Chapter N", so the prose noun in
  # "Chapter~\ref{ch:X}" doubles (190 sites found in the R22 visual-parity
  # audit). `role: ref` targets the {ref}-role matcher added by #188 — this
  # replaces the R22 Class J raw-regex rewrite at the designed surface.
  # Opt-in by design: whether chapter {ref}s render a noun depends on the
  # book's myst.yml numbering mode, which the converter can't know.
  - { noun: Chapter,  prefix: ch-, role: ref }
  - { noun: Chapters, prefix: ch-, role: ref }

# --- LaTeX pre-processing ---------------------------------------------------

preprocess:
  # The book ships as one consolidated .tex with 22 \chapter*?{...} blocks
  # (4 starred front matter + 12 numbered chapters + 6 lettered appendices).
  # Order in `into:` must match the order the blocks appear in the source —
  # the splitter writes the Nth block to into[N-1].
  split:
    - source: Deep_Learning_for_Solving_And_Estimating_Dynamic_Economic_Models
      into:
        - preface
        - how_to_read
        - notation
        - execution_map
        - ch01_intro
        - ch02_deqns
        - ch03_irbc
        - ch04_nas
        - ch05_olg
        - ch06_ha_youngs
        - ch07_pinns
        - ch08_ctime_ha
        - ch09_surrogates_gps
        - ch10_smm
        - ch11_climate
        - ch12_synthesis
        - appA_glossary
        - appB_matrix_calc
        - appC_ito
        - appD_fixed_points
        - appE_reproducibility
        - appF_solutions

  strip:
    - '\\index\{[^}]*\}'
    - '\\clearpage'
    - '\\newpage'
    - '\\noindent'
    - '\\vspace\{[^}]*\}'
    # Strip trailing document-level commands carried into the final
    # split-chapter file (the splitter takes content to EOF).
    - '\\bibliography\{[^}]*\}'
    - '\\end\{document\}'

  rewrites:
    # Unwrap \scalebox{N}{\includegraphics{...}} (with optional [opts])
    - { from: '\\scalebox\{[0-9.]+\}\s*\{\s*(\\includegraphics(?:\[[^\]]*\])?\s*\{[^{}]*\})\s*\}',
        to: '\1' }
    # \tpath{...} is defined via \DeclareUrlCommand (preamble line 143) so the
    # source can render filenames/identifiers in monospace with breakable
    # `_ . /`. Pandoc does not recognize it and silently drops both the macro
    # and its argument, producing visibly broken sentences ("the variable name
    # ;", "In notebook ,"). Rewriting to \texttt{...} restores the content
    # cleanly — pandoc emits inline code spans. The argument pattern allows
    # \{ \} escape sequences so the one occurrence with literal braces
    # (\tpath{\{smoke, teaching, production\}}) round-trips. Tracked at
    # https://github.com/mmcky/Deep_Learning_for_Solving_And_Estimating_Dynamic_Economic_Models/issues/9
    - { from: '\\tpath\{((?:\\.|[^{}])*)\}',
        to:   '\\texttt{\1}' }
    # \emphc{...} is defined in the preamble (line 142) as
    # \textcolor{harvardcrimson}{\textbf{...}} for the "bold crimson" emphasis
    # style. Pandoc drops the whole construct when it can't resolve the custom
    # color, taking the argument with it. Rewrite to \textbf{...}: the HTML
    # output loses the crimson hue but keeps the emphasis. Same root cause as
    # the \tpath rewrite above; tracked under the same issue.
    - { from: '\\emphc\{((?:\\.|[^{}])*)\}',
        to:   '\\textbf{\1}' }
    # \checkmark (from amssymb) is dropped by pandoc — flagged by upstream
    # _warn_dropped_text_macros (claude-latex-to-myst #50). Rewrite to the
    # unicode ✓ glyph; one occurrence in ch06_ha_youngs §6.x verification
    # ("0.027 + 0.003 + 0.018 + 0.002 = 0.05 = m ✓").
    - { from: '\\checkmark(?![A-Za-z@])',
        to:   '✓' }

# --- Post-pandoc Markdown rewrites ------------------------------------------

postprocess:
  rewrites:
    # The Glossary's source uses ``\item[\textbf{Term.}]`` (bold inside the
    # description label). Upstream PR #19 preserves the label content
    # verbatim, so the literal ``\textbf{...}`` survives into the term line.
    # Convert it to MyST bold so def-list terms render cleanly.
    - { stems: [appA_glossary],
        from:  '^\\textbf\{([^}]*)\}$',
        to:    '**\1**' }

    # === R12: Hidden-text-loss cleanup (post-fidelity walkthrough) ============
    # The five rewrites below clear ~95 visible artifacts found by reading
    # source/MD in parallel across all 22 chapters. Each artifact is a case
    # where pandoc drops a LaTeX construct but leaves the surrounding prose
    # intact, producing visibly broken sentences in the rendered HTML.

    # Class A.1 — \pageref{ex:X:N} drops leave dangling "(statement: p.<NBSP>):"
    # in appF solution headings (79 instances, one per solution).
    #   Source : \paragraph{Exercise~\ref{ex:X:N} (statement: p.~\pageref{ex:X:N}): Title.}
    #   Before : ##### {prf:ref}`ex-X-N` (statement: p.<NBSP>): Title.
    #   After  : ##### {prf:ref}`ex-X-N`: Title.
    # The {prf:ref} is already the back-link to the exercise statement, so the
    # "(statement: p. X)" parenthetical is redundant in HTML (no page numbers
    # in flowing layout).
    - { from: ' \(statement: p\.\xa0\):',
        to:   ':' }

    # Class A.2 — \pageref{} drops leave "on page<NBSP>." in body prose. The
    # NBSP comes from the source's `~` tie ("page~\pageref{X}") so it sits
    # directly between "page" and the period — no whitespace inside.
    #   Source : "...the Chapter Summary on page~\pageref{sec:ch1_summary}. ..."
    #   Before : "...the Chapter Summary on page<NBSP>. ..."
    #   After  : "...the Chapter Summary. ..."
    # 2 instances in ch01 (both pointing at the same Chapter Summary label).
    - { from: ' on page\xa0\.',
        to:   '.' }

    # Class D — \textcolor{COLOR}{TEXT} leaks: the macro is invisible in HTML
    # but its syntax shows up as literal text. 5 instances in ch11_climate's
    # alg-nsdeqn block use \textcolor{uzhgreydark!70}{...} as a "grayed-out"
    # hint. Keep the TEXT; drop the color wrapper. Non-greedy with a lookahead
    # for end-of-line OR trailing `\\` so balanced math braces inside the TEXT
    # don't fool the regex.
    - { from: '\\textcolor\{[^}]+\}\{(.*?)\}(?=\s*(?:\\\\|$))',
        to:   '\1' }

    # Class E.1 — \hspace{...} layout commands leak from the alg-nsdeqn body
    # (1 instance in ch11_climate). Horizontal spacing has no meaning in HTML
    # flow; drop. The 1 other \hspace in source is inside a tabular column
    # spec, consumed by pandoc — never reaches postprocess.
    - { from: '\\hspace\{[^}]*\}',
        to:   '' }

    # Class E.2 — \protect\texttt{X} compound leak (1 instance, ch02_deqns'
    # lstlisting caption). \protect prevents fragile commands from breaking
    # in moving args; meaningless in HTML. The inner \texttt{X} should be
    # backtick-code. Narrow rewrite: only when \protect immediately precedes
    # \texttt to avoid touching the bare \texttt{} cases that live inside
    # math (e.g. ch04: $\{\texttt{relu}, \texttt{tanh}, ...\}$) which KaTeX
    # renders correctly as-is.
    - { from: '\\protect\\texttt\{([^}]+)\}',
        to:   '`\1`' }

    # R18 — Class H: escape the bracket of `**[NEW: … `@tf.function` …]**` in
    # ch02's DEQN-training algorithm box. mystmd scans `[ … ]` bracket spans
    # for pandoc-style citations and treats the `@tf.function` token as a
    # citation key *even though it sits inside a backtick code span*, swallowing
    # the whole bracket into an unresolved-cite node ("Could not link citation
    # with label 'tf.function'") and mangling the rendered line. Escaping the
    # opening `[` (renders as a literal bracket, identical text) stops the
    # citation parse. One occurrence book-wide (ch02_deqns line ~118); the
    # root cause is a mystmd parser precedence bug (code spans should shield
    # `@` tokens from citation scanning) — filed as QuantEcon/mystmd#46.
    - { stems: [ch02_deqns],
        from:  '\*\*\[(NEW: wrap the per-step kernel)',
        to:    '**\\[\1' }

    # R24 — Class L: escape line-leading custom enumerate markers so qe-v8
    # does not eat them. QuantEcon/mystmd#50 (fancy ordered lists) landed
    # between qe-v6 and qe-v8, so `(a) text` at column 1 is now *parsed* as
    # an ordered-list marker where qe-v6 left it as literal paragraph text.
    # The parse itself is right — the AST carries `style: lower-alpha` /
    # `delimiter: parens` — but the HTML renderer drops both and emits a bare
    # `<ol start="1">`, so the markers render "1./2./3." instead of
    # "(a)/(b)/(c)". Net effect on upgrade: 10 labels silently lost (appF ×6:
    # a,b,c,i,ii,iii; ch02 ×4: a,b). Escaping the parens restores the exact
    # qe-v6 rendering (literal text, verified byte-identical). Same shape as
    # Class H above: escape the delimiter that trips a mystmd parser.
    # Root cause is upstream in QuantEcon/mystmd (HTML renderer, not the
    # parser), filed as QuantEcon/mystmd#74. Drop Class L once the renderer
    # honours the fancy-list style/delimiter, and prefer the designed surface
    # (`postprocess.enumerate_style`, converter #111) at that point.
    - { stems: [appF_solutions, ch02_deqns],
        from:  '^\((iii|ii|i|a|b|c)\) ',
        to:    '\\(\1\\) ' }

    # (R16 Class F deleted in R18: upstream #105/#106 landed — \texttt{{@}foo}
    # now converts to a single clean code span in both prose and algorithm
    # bodies, so the `@``-collapse rewrite no longer matched anything.)
    # (R16 Class G deleted in R18: upstream #104 landed — extensionless
    # \includegraphics{fig/restud_*} is now resolved to the copied raster by
    # the converter itself; verified by reconverting ch11 with the rewrite
    # removed.)
    # (R20 Class I deleted in R21: upstream #181 — QuantEcon/claude-latex-to-myst
    # #179 — landed, so pandoc no longer misparses the "@" in mailto: URLs /
    # \nolinkurl / \url bodies as a citation. The preface email now renders as a
    # clean `simon.scheidegger@unil.ch` mailto link with no `{cite:t}`unil`` left
    # to rewrite; verified by reconverting preface with the rewrite removed.
    # book#2 no longer needs a downstream stopgap.)
    # (R22 Class J deleted in R23: upstream #188 — issue #184 — added the
    # `role: ref` key to doubled_noun_refs, so the Chapter/Chapters entries
    # now live at the designed config surface above; verified byte-identical
    # output vs the Class J regex. R22 Class K deleted in R23: upstream #187
    # — issue #185 — fixed the escapeinside={(*}{*)} option-scan break in the
    # converter, so the ch06 lstlisting no longer leaks its option group.)

# --- Validation -------------------------------------------------------------

validate:
  equations: true
  cross_references: true
  theorems: true
  figures: true
  citations: true
  broken_inline_math: true
